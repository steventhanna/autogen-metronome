[package]
name = "autogen-metronome"
version = "0.1.6"
edition = "2024"
license = "MIT"
description = "Auto-generated, strongly-typed Rust client for the Metronome API"
keywords = ["metronome", "billing", "api", "sdk"]
categories = ["api-bindings"]
repository = "https://github.com/steventhanna/autogen-metronome"
readme = "README.md"

# Ship only what consumers need; exclude regeneration tooling and generator markdown.
exclude = [
    "docs/",
    "openapi.json",
    "SPEC_HASH",
    "generate.sh",
    "scripts/",
    ".github/",
    ".openapi-generator/",
    ".openapi-generator-ignore",
    "CLAUDE.md",
]

# Build docs.rs with every API group enabled so the full surface is documented.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# openapi-generator 7.15+ maps `format: date-time` to chrono::DateTime<chrono::FixedOffset>.
# The generated code is regenerated but this hand-written manifest is not, so chrono is
# declared here. Keep in sync with the version the generator's own Cargo.toml emits.
chrono = { version = "^0.4", features = ["serde"] }
reqwest = { version = "^0.12", default-features = false, features = ["json", "multipart"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "^1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["all", "native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-tls"]
all = [
    "alerts",
    "billable-metrics",
    "contracts",
    "credits-and-commits",
    "custom-fields",
    "customers",
    "invoices",
    "named-schedules",
    "notifications",
    "packages",
    "products",
    "rate-cards",
    "security",
    "settings",
    "usage",
]
alerts = []
billable-metrics = []
contracts = []
credits-and-commits = []
custom-fields = []
customers = []
invoices = []
named-schedules = []
notifications = []
packages = []
products = []
rate-cards = []
security = []
settings = []
usage = []
integration = []
